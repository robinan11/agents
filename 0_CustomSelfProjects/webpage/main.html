<!DOCTYPE html>
<html>
<head>
    <title>AI Chat Input</title>
    <style>
        body { font-family: Arial; }
        #chat { width: 400px; margin: 50px auto; border: 1px solid #ccc; border-radius: 8px; padding: 16px; }
        #messages { height: 200px; overflow-y: auto; margin-bottom: 12px; border: 1px solid #eee; padding: 8px; }
        #userInput { width: 80%; padding: 8px; }
        #sendBtn { padding: 8px 12px; }
    </style>
</head>
<body>
    <div id="chat">
        <div id="messages"></div>
        <input type="text" id="userInput" placeholder="Type your message..." />
        <button id="sendBtn">Send</button>
    </div>
<script>
    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    
    function addMessage(who, text) {
        const msg = document.createElement('div');
        msg.textContent = who + ": " + text;
        messagesDiv.appendChild(msg);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    sendBtn.onclick = async function() {
        const userText = userInput.value;
        if (userText.trim() === "") return;
        addMessage("You", userText);
        userInput.value = "";

        // Send message to your AI agent server
        try {
            const response = await fetch('http://localhost:5000/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userText })
            });
            const data = await response.json();
            addMessage("AI", data.reply);
        } catch (error) {
            addMessage("AI", "Sorry, I could not connect to the AI agent.");
        }
    };
</script>
</body>
</html>
